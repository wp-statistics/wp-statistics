name: "🐞 Bug Report"
description: Report a reproducible problem with WP Statistics
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below so we can
        reproduce and fix it quickly.

        ⚠️ **Security issue?** Do not open a public issue — report it privately via
        https://patchstack.com/database/vdp/wp-statistics
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional, but very helpful.
    validations:
      required: false
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 14.13
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.5
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Hosting, browser, active theme, other active plugins, multisite, caching, etc.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I reproduced this with other plugins disabled and a default theme.
          required: false
